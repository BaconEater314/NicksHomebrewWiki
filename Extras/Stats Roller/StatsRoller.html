<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stats Roller for D&D 5e characters">
    <meta name="author" content="Cody Owens">
    <title>Nick's Homebrew Wiki - Stat Roller</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Atributes.css">

    <style>
        /* Page-specific styling for the Stat Roller — builds on top of Atributes.css tokens */

        .roller-shell {
            max-width: 680px;
            margin: 3rem auto;
            padding: 2.25rem 2rem 2.5rem;
            background: var(--bg-paper);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 4px 18px var(--shadow);
            text-align: center;
        }

        .roller-shell h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.9rem;
            color: var(--ink);
            margin-bottom: 0.35rem;
        }

        .roller-shell .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 2.25rem;
        }

        #RollStats {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--bg-paper);
            background: var(--accent);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2.25rem;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }

        #RollStats:hover {
            background: var(--accent-hi);
        }

        #RollStats:active {
            transform: scale(0.97);
        }

        /* ── Ability score list — double-peak notch cards ──────────── */

        .ability-stack {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.1rem 1rem;
            max-width: 560px;
            margin: 2.75rem auto 1rem;
        }

        @media (max-width: 520px) {
            .ability-stack {
                grid-template-columns: 1fr;
                max-width: 300px;
            }
        }

        .ability-box {
            position: relative;
            background: var(--bg-sunken);
            border: 2px solid var(--line);
            /* Two peaks at the very top, corners recessed, valley dipping
               between them — a straight-edge "crown" silhouette */
            clip-path: polygon(
                0% 24%, 22% 0%, 50% 32%, 78% 0%, 100% 24%,
                100% 100%, 0% 100%
            );
            padding: 2.5rem 1.5rem 1.2rem;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        .ability-box.rolled {
            border-color: var(--accent);
        }

        .ability-name {
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.72rem;
            color: var(--muted);
            margin-bottom: 0.4rem;
        }

        .ability-score-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.6rem;
        }

        .ability-score {
            font-family: 'Crimson Pro', serif;
            font-size: 3.1rem;
            font-weight: 700;
            color: var(--ink);
            line-height: 1;
        }

        .ability-mod {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--bg-paper);
            background: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
        }

        /* Roll log / breakdown line */
        #result {
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            color: var(--muted);
            background: var(--bg-sunken);
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-top: 1.75rem;
            padding: 0.75rem 1.1rem;
            min-height: 1.2rem;
        }

        #result:empty::before {
            content: "Roll to generate your ability scores.";
            font-style: italic;
        }
    </style>
</head>

<body class="content-page">
    <main class="page-shell">
        <section class="page-card roller-shell">
            <h1>Ability Score Roller</h1>
            <p class="subtitle">4d6, drop the lowest — one roll per ability score, auto rerolls 1s</p>

            <button id="RollStats" type="button">Roll Stats</button>

            <div class="ability-stack">
                <div class="ability-box" data-stat="str">
                    <div class="ability-name">Strength</div>
                    <div class="ability-score-row">
                        <span class="ability-score" id="str-score">—</span>
                        <span class="ability-mod" id="str-mod">+0</span>
                    </div>
                </div>
                <div class="ability-box" data-stat="dex">
                    <div class="ability-name">Dexterity</div>
                    <div class="ability-score-row">
                        <span class="ability-score" id="dex-score">—</span>
                        <span class="ability-mod" id="dex-mod">+0</span>
                    </div>
                </div>
                <div class="ability-box" data-stat="con">
                    <div class="ability-name">Constitution</div>
                    <div class="ability-score-row">
                        <span class="ability-score" id="con-score">—</span>
                        <span class="ability-mod" id="con-mod">+0</span>
                    </div>
                </div>
                <div class="ability-box" data-stat="int">
                    <div class="ability-name">Intelligence</div>
                    <div class="ability-score-row">
                        <span class="ability-score" id="int-score">—</span>
                        <span class="ability-mod" id="int-mod">+0</span>
                    </div>
                </div>
                <div class="ability-box" data-stat="wis">
                    <div class="ability-name">Wisdom</div>
                    <div class="ability-score-row">
                        <span class="ability-score" id="wis-score">—</span>
                        <span class="ability-mod" id="wis-mod">+0</span>
                    </div>
                </div>
                <div class="ability-box" data-stat="cha">
                    <div class="ability-name">Charisma</div>
                    <div class="ability-score-row">
                        <span class="ability-score" id="cha-score">—</span>
                        <span class="ability-mod" id="cha-mod">+0</span>
                    </div>
                </div>
            </div>

            <p id="result"></p>
        </section>
    </main>

    <script>
        /*
          Helper for the roll method. Call setAbilityScore("str", 14) and it
          fills in the score, computes the modifier, and marks the card as rolled.
        */
        function setAbilityScore(stat, score) {
            const scoreEl = document.getElementById(stat + "-score");
            const modEl = document.getElementById(stat + "-mod");
            const boxEl = document.querySelector('.ability-box[data-stat="' + stat + '"]');
            if (!scoreEl || !modEl) return;

            const mod = Math.floor((score - 10) / 2);
            scoreEl.textContent = score;
            modEl.textContent = (mod >= 0 ? "+" : "") + mod;
            if (boxEl) boxEl.classList.add("rolled");
        }
    </script>
    <script src="StatsRoller.js"></script>
</body>
</html>
